name: Build MSI (on demand)

on:
  # Manual trigger only — the user prefers to approve every CI run
  # rather than burning ~3 minutes of Actions time on every merge.
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional: override computed version (e.g. 0.3.0.0). Leave empty to use latest git tag.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags needed so `git describe` can find the latest release tag.
          fetch-depth: 0

      - name: Compute version from git tag + commits-since-tag
        id: version
        shell: pwsh
        run: |
          if ("${{ inputs.version_override }}" -ne "") {
            $version4 = "${{ inputs.version_override }}"
            Write-Host "Using override version: $version4"
            # Make sure override has 4 parts.
            $parts = $version4 -split '\.'
            while ($parts.Count -lt 4) { $parts = $parts + '0' }
            $version4 = ($parts[0..3] -join '.')
          }
          else {
            # Use `git describe --tags --long` which returns e.g.
            # "v0.4.0-28-g903cc1f" = "tag-commitsSinceTag-gShortHash".
            # The commits-since-tag goes into the 4th MSI version component
            # so every commit produces a UNIQUE MSI version. Without this,
            # every build between two tags has the identical version
            # ("0.3.0.0" forever) and Windows sees them as the same install.
            $desc = (git describe --tags --long 2>$null) -as [string]
            if ([string]::IsNullOrEmpty($desc)) {
              # No tags yet — fall back to commit count from root.
              $count = (git rev-list --count HEAD 2>$null) -as [string]
              if ([string]::IsNullOrEmpty($count)) { $count = "0" }
              $version4 = "0.0.0.$count"
              Write-Host "No git tag found, defaulting to $version4 (HEAD has $count commits)"
            } else {
              # Parse "v0.4.0-28-g903cc1f" → tag=v0.4.0, commits=28
              # Right-most match: TAG-COMMITS-gHASH
              if ($desc -match '^(?<tag>.+)-(?<commits>\d+)-g[0-9a-f]+$') {
                $tag = $matches.tag
                $commits = [int]$matches.commits
              } else {
                # Exactly on a tag → format is just "v0.4.0" without -N-gHASH.
                # `--long` always includes -N-gHASH so this path shouldn't hit
                # but defend against future git changes.
                $tag = $desc
                $commits = 0
              }
              # Strip leading 'v' and any pre-release suffix (e.g. -beta.1).
              $semver = ($tag -replace '^v', '' -split '-')[0]
              $semverParts = $semver -split '\.'
              # Take major.minor.patch, then 4th component = commits-since-tag
              while ($semverParts.Count -lt 3) { $semverParts = $semverParts + '0' }
              $version4 = "$($semverParts[0]).$($semverParts[1]).$($semverParts[2]).$commits"
              Write-Host "git describe → $desc"
              Write-Host "  Tag = $tag, commits since tag = $commits"
              Write-Host "  → MSI version = $version4"
            }
          }
          "version=$version4" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Final MSI version: $version4"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore
        run: dotnet restore LiveStreamSound.slnx

      - name: Build libraries
        run: |
          dotnet build src/LiveStreamSound.Shared/LiveStreamSound.Shared.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/LiveStreamSound.Host/LiveStreamSound.Host.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/LiveStreamSound.Client/LiveStreamSound.Client.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Run unit + integration tests
        run: |
          dotnet test tests/LiveStreamSound.Shared.Tests/LiveStreamSound.Shared.Tests.csproj -c Release --no-restore --verbosity normal
          dotnet test tests/LiveStreamSound.Host.Tests/LiveStreamSound.Host.Tests.csproj -c Release --no-restore --verbosity normal
          dotnet test tests/LiveStreamSound.Client.Tests/LiveStreamSound.Client.Tests.csproj -c Release --no-restore --verbosity normal
          dotnet test tests/LiveStreamSound.Integration.Tests/LiveStreamSound.Integration.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish App (self-contained, bundled .NET runtime)
        run: >
          dotnet publish src/LiveStreamSound.App/LiveStreamSound.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          --no-restore

      - name: Build MSI installer
        run: dotnet build installer/App/LiveStreamSound.App.Installer.wixproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveStreamSound-MSI-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            installer/App/bin/Release/*.msi
            installer/App/bin/Release/*.wixpdb

      - name: Upload self-contained publish folder
        uses: actions/upload-artifact@v4
        with:
          name: LiveStreamSound-App-Portable-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            src/LiveStreamSound.App/bin/Release/net10.0-windows/win-x64/publish/**
